<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 56" width="210" height="56">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111a2b"/>
      <stop offset="100%" stop-color="#0a0f19"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#8957e5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="1" y="1" width="208" height="54" rx="12"/></clipPath>
    <style>
      .s { animation: s 5s ease-in-out infinite; animation-delay: 3.6s; }
      @keyframes s { 0% { transform: translateX(-120px); } 60%, 100% { transform: translateX(280px); } }
      .ping { transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out infinite; }
      @keyframes ping { 0% { transform: scale(0.6); opacity: 0.8; } 100% { transform: scale(2.2); opacity: 0; } }
    </style>
  </defs>
  <rect x="1" y="1" width="208" height="54" rx="12" fill="url(#fill)" stroke="url(#edge)" stroke-width="1.2"/>
  <g clip-path="url(#c)"><rect class="s" x="0" y="0" width="80" height="56" fill="url(#shine)" transform="skewX(-20)"/></g>
  <ellipse class="ping" cx="28" cy="38" rx="5" ry="1.8" fill="none" stroke="#58a6ff" stroke-width="1"/>
  <g fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-linejoin="round">
    <path d="M28 38s-8-7.5-8-13.5a8 8 0 0 1 16 0C36 30.5 28 38 28 38z"/>
    <circle cx="28" cy="24.5" r="3"/>
  </g>
  <text x="50" y="23" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#8b949e">LOCATION</text>
  <text x="50" y="41" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#e6edf3">Baku, Azerbaijan</text>
</svg>
