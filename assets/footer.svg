<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="50%" stop-color="#0a1a2f"/>
      <stop offset="100%" stop-color="#05070d"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="140" rx="14"/></clipPath>

    <pattern id="far" width="400" height="140" patternUnits="userSpaceOnUse">
      <g fill="#8b949e">
        <circle cx="20" cy="18" r="0.7"/><circle cx="75" cy="96" r="0.6"/><circle cx="130" cy="44" r="0.8"/>
        <circle cx="190" cy="122" r="0.6"/><circle cx="240" cy="70" r="0.7"/><circle cx="300" cy="12" r="0.6"/>
        <circle cx="350" cy="108" r="0.8"/><circle cx="385" cy="58" r="0.6"/><circle cx="160" cy="84" r="0.5"/>
      </g>
    </pattern>
    <pattern id="mid" width="600" height="140" patternUnits="userSpaceOnUse">
      <g fill="#c9d1d9">
        <circle cx="40" cy="60" r="1.1"/><circle cx="120" cy="20" r="1.0"/><circle cx="210" cy="110" r="1.2"/>
        <circle cx="290" cy="40" r="0.9"/><circle cx="370" cy="90" r="1.1"/><circle cx="450" cy="16" r="1.0"/>
        <circle cx="520" cy="128" r="1.2"/><circle cx="575" cy="72" r="0.9"/>
      </g>
    </pattern>
    <pattern id="near" width="900" height="140" patternUnits="userSpaceOnUse">
      <g>
        <rect x="60" y="34" width="46" height="1.6" rx="0.8" fill="url(#streak)"/>
        <rect x="330" y="102" width="60" height="1.8" rx="0.9" fill="url(#streak)"/>
        <rect x="610" y="58" width="40" height="1.4" rx="0.7" fill="url(#streak)"/>
        <rect x="800" y="120" width="52" height="1.6" rx="0.8" fill="url(#streak)"/>
        <circle cx="60" cy="34.8" r="1.6" fill="#ffffff"/>
        <circle cx="330" cy="102.9" r="1.8" fill="#ffffff"/>
        <circle cx="610" cy="58.7" r="1.5" fill="#ffffff"/>
        <circle cx="800" cy="120.8" r="1.6" fill="#ffffff"/>
      </g>
    </pattern>

    <style>
      .far  { animation: far 40s linear infinite; }
      .mid  { animation: mid 18s linear infinite; }
      .near { animation: near 6s linear infinite; }
      @keyframes far  { from { transform: translateX(0); } to { transform: translateX(-400px); } }
      @keyframes mid  { from { transform: translateX(0); } to { transform: translateX(-600px); } }
      @keyframes near { from { transform: translateX(0); } to { transform: translateX(-900px); } }
      .pulse { animation: pulse 4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="140" fill="url(#bg)"/>
    <ellipse cx="300" cy="70" rx="320" ry="90" fill="url(#glowB)"/>
    <ellipse cx="900" cy="70" rx="360" ry="90" fill="url(#glowA)"/>

    <rect class="far"  width="1600" height="140" fill="url(#far)"/>
    <rect class="mid"  width="1800" height="140" fill="url(#mid)"/>
    <rect class="near" width="2100" height="140" fill="url(#near)"/>

    <rect class="pulse" x="0" y="0" width="1200" height="1.5" fill="url(#line)"/>

    <text x="600" y="66" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="4" fill="#e6edf3">THANKS FOR VISITING</text>
    <text x="600" y="92" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#58a6ff">elcanismayilov.com</text>
  </g>
</svg>
