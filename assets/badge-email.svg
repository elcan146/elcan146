<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 56" width="250" height="56">
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111a2b"/>
      <stop offset="100%" stop-color="#0a0f19"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#8957e5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c"><rect x="1" y="1" width="248" height="54" rx="12"/></clipPath>
    <style>
      .s { animation: s 5s ease-in-out infinite; animation-delay: 1.2s; }
      @keyframes s { 0% { transform: translateX(-120px); } 60%, 100% { transform: translateX(320px); } }
    </style>
  </defs>
  <rect x="1" y="1" width="248" height="54" rx="12" fill="url(#fill)" stroke="url(#edge)" stroke-width="1.2"/>
  <g clip-path="url(#c)"><rect class="s" x="0" y="0" width="80" height="56" fill="url(#shine)" transform="skewX(-20)"/></g>
  <g fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <rect x="17" y="20" width="22" height="16" rx="2.5"/>
    <path d="M18 22l10 7.5L38 22"/>
  </g>
  <text x="50" y="23" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#8b949e">EMAIL</text>
  <text x="50" y="41" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#e6edf3">me@elcanismayilov.com</text>
</svg>
